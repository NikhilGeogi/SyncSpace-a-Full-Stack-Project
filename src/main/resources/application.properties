spring.application.name=Final

# \u4f3a\u670d\u5668\u57e0\u865f\uff08\u9810\u8a2d\u70ba 8080\uff09
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Existing databases are baselined at V1; new databases run all migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax